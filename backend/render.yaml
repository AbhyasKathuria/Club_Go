services:
  - type: web
    name: clubgo-backend
    env: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: clubgo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BACKUP_INTERVAL_HOURS
        value: 6

databases:
  - name: clubgo-db
    plan: starter
    postgresMajorVersion: 16
